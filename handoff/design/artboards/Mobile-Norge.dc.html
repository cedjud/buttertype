<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Æ Ø Å mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:"BT Smör";src:url(/_blob/15c80a26168368d082474370359a4c47) format("woff2")}
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:1650px;box-sizing:border-box;background:#0A0A0A;color:#FFD21F;font-family:'Familjen Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="height:360px;flex:none;box-sizing:border-box;padding:22px 20px;border-bottom:1px solid #FFD21F;display:flex;flex-direction:column;justify-content:space-between">
    <div style="font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.09em;text-transform:uppercase">04 — Skrevet for Norge</div>
    <h2 style="margin:0;font-family:'BT Smör',sans-serif;font-weight:400;line-height:.95;font-variation-settings:'MELT' 0"><span style="display:block;font-size:92px">Æ Ø Å,</span><span style="display:block;font-size:54px">drawn from<br>scratch.</span></h2>
    <p style="margin:0;font-size:16px;line-height:1.4;color:#FFFFFF">Not accents bolted on afterwards. Each Nordic letter is built into the system and melts with it.</p>
  </div>
  <sc-for list="{{glyphs}}" as="g" hint-placeholder-count="3">
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;border-bottom:1px solid #FFD21F">
      <div style="height:48px;flex:none;box-sizing:border-box;padding:0 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #FFD21F;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase"><span>{{g.num}}</span><span>MELT {{g.m}}</span></div>
      <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden"><div style="{{g.style}}">{{g.ch}}</div></div>
      <div style="height:52px;flex:none;box-sizing:border-box;padding:0 20px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #FFD21F;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#FFFFFF"><span>{{g.code}}</span><span style="{{g.wordStyle}}">{{g.word}}</span></div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1650}}'>
class Component extends DCLogic {
  renderVals() {
    const gs = (m) => "font-family:'BT Smör',sans-serif;font-weight:400;font-size:290px;line-height:1;padding-bottom:10px;font-variation-settings:'MELT' " + m + ",'BUBL' 100,'SLMP' 100";
    const wsty = (m) => "font-family:'BT Smör',sans-serif;font-size:32px;line-height:1;letter-spacing:0;text-transform:none;color:#FFD21F;font-variation-settings:'MELT' " + m;
    return { glyphs: [
      { num: '01', m: 0, ch: 'Æ', code: 'U+00C6 · U+00E6', word: 'ærlig', style: gs(0), wordStyle: wsty(0) },
      { num: '02', m: 40, ch: 'Ø', code: 'U+00D8 · U+00F8', word: 'smør', style: gs(40), wordStyle: wsty(40) },
      { num: '03', m: 72, ch: 'Å', code: 'U+00C5 · U+00E5', word: 'på', style: gs(72), wordStyle: wsty(72) }
    ] };
  }
}
</script>
</body>
</html>
