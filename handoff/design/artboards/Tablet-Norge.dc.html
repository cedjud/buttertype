<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Æ Ø Å tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:"BT Smör";src:url(/_blob/15c80a26168368d082474370359a4c47) format("woff2")}
body{margin:0}
</style>
</helmet>
<div style="width:768px;height:900px;box-sizing:border-box;background:#0A0A0A;color:#FFD21F;font-family:'Familjen Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="height:330px;flex:none;box-sizing:border-box;padding:24px;border-bottom:1px solid #FFD21F;display:flex;flex-direction:column;justify-content:space-between">
    <div style="font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.09em;text-transform:uppercase">04 — Skrevet for Norge</div>
    <h2 style="margin:0;font-family:'BT Smör',sans-serif;font-weight:400;line-height:.95;font-variation-settings:'MELT' 0"><span style="display:block;font-size:120px">Æ Ø Å,</span><span style="display:block;font-size:56px;white-space:nowrap">drawn from scratch.</span></h2>
    <p style="margin:0;max-width:520px;font-size:17px;line-height:1.4;color:#FFFFFF">Not accents bolted on afterwards. Each Nordic letter is built into the system and melts with it.</p>
  </div>
  <div style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr))">
    <sc-for list="{{glyphs}}" as="g" hint-placeholder-count="3">
      <div style="display:flex;flex-direction:column;justify-content:space-between;min-width:0;border-right:1px solid #FFD21F">
        <div style="padding:14px 20px;display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #FFD21F"><span>{{g.num}}</span><span>MELT {{g.m}}</span></div>
        <div style="display:flex;align-items:center;justify-content:center;overflow:hidden"><div style="{{g.style}}">{{g.ch}}</div></div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 20px;border-top:1px solid #FFD21F;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#FFFFFF"><span>{{g.code}}</span><span style="{{g.wordStyle}}">{{g.word}}</span></div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":768,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const gs = (m) => "font-family:'BT Smör',sans-serif;font-weight:400;font-size:230px;line-height:1;padding-bottom:10px;font-variation-settings:'MELT' " + m + ",'BUBL' 100,'SLMP' 100";
    const wsty = (m) => "font-family:'BT Smör',sans-serif;font-size:28px;line-height:1;letter-spacing:0;text-transform:none;color:#FFD21F;font-variation-settings:'MELT' " + m;
    return { glyphs: [
      { num: '01', m: 0, ch: 'Æ', code: 'U+00C6', word: 'ærlig', style: gs(0), wordStyle: wsty(0) },
      { num: '02', m: 40, ch: 'Ø', code: 'U+00D8', word: 'smør', style: gs(40), wordStyle: wsty(40) },
      { num: '03', m: 72, ch: 'Å', code: 'U+00C5', word: 'på', style: gs(72), wordStyle: wsty(72) }
    ] };
  }
}
</script>
</body>
</html>
