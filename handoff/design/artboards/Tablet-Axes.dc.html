<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three axes tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:"BT Smör";src:url(/_blob/15c80a26168368d082474370359a4c47) format("woff2")}
body{margin:0}
</style>
</helmet>
<div style="width:768px;height:1200px;box-sizing:border-box;background:#FFFFFF;color:#0A0A0A;font-family:'Familjen Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="height:300px;flex:none;box-sizing:border-box;padding:24px 24px 22px;border-bottom:1px solid #0A0A0A;display:flex;flex-direction:column;justify-content:space-between">
    <div style="font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.09em;text-transform:uppercase">03 — Three axes, one block of butter</div>
    <h2 style="margin:0;font-family:'BT Smör',sans-serif;font-weight:400;font-size:132px;line-height:.95;white-space:nowrap;font-variation-settings:'MELT' 0">Dial it in.</h2>
    <p style="margin:0;max-width:560px;font-size:18px;line-height:1.4">Every letter is built from overlapping strokes, so the font morphs smoothly between a crisp, sharp-cornered face and a bubbling puddle.</p>
  </div>
  <sc-for list="{{axes}}" as="ax" hint-placeholder-count="3">
    <div style="flex:1;min-height:0;display:grid;grid-template-columns:190px minmax(0, 1fr);border-bottom:1px solid #0A0A0A">
      <div style="padding:20px 24px;border-right:1px solid #0A0A0A;display:flex;flex-direction:column;justify-content:space-between">
        <span style="font-family:'BT Smör',sans-serif;font-size:54px;line-height:1">{{ax.tag}}</span>
        <span style="font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;line-height:1.5;white-space:pre-line">{{ax.range}}</span>
      </div>
      <div style="display:flex;flex-direction:column;min-width:0">
        <div style="height:200px;flex:none;display:flex;align-items:center;justify-content:center;background:{{ax.bg}};color:{{ax.fg}};overflow:hidden;padding:0 0 16px;border-bottom:1px solid #0A0A0A"><div style="{{ax.wordStyle}}">Smør</div></div>
        <div style="flex:1;display:grid;grid-template-columns:minmax(0, 1.5fr) minmax(0, 1fr)">
          <div style="padding:16px 24px;font-size:15px;line-height:1.4;border-right:1px solid #0A0A0A">{{ax.text}}</div>
          <div style="padding:16px 24px">
            <div style="display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px"><span>0</span><span style="font-size:18px;letter-spacing:0">{{ax.value}}</span><span>100</span></div>
            <div style="height:2px;background:#0A0A0A;position:relative"><div style="position:absolute;top:-9px;left:{{ax.pos}}%;width:20px;height:20px;margin-left:-10px;background:#FFD21F;border:2px solid #0A0A0A"></div></div>
          </div>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":768,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const ws = (m, b, s) => "font-family:'BT Smör',sans-serif;font-weight:400;font-size:166px;line-height:1;white-space:nowrap;font-variation-settings:'MELT' " + m + ",'BUBL' " + b + ",'SLMP' " + s;
    return { axes: [
      { tag: 'MELT', range: 'Meltiness\n0–100\ndefault 0', bg: '#FFD21F', fg: '#0A0A0A', value: 70, pos: 70, wordStyle: ws(70, 100, 100), text: 'From razor-sharp corners to a full puddle. Terminals round off, drips form, letters sink.' },
      { tag: 'BUBL', range: 'Bubbles\n0–100\ndefault 100', bg: '#0A0A0A', fg: '#FFD21F', value: 100, pos: 100, wordStyle: ws(100, 100, 100), text: 'Foam on the puddle, bubbles rising, tiny pan-sizzle droplets. Shown at MELT 100.' },
      { tag: 'SLMP', range: 'Slump\n0–100\ndefault 100', bg: '#FFFFFF', fg: '#0A0A0A', value: 20, pos: 20, wordStyle: ws(100, 40, 20), text: 'How far the letters lean, droop and sink. Dial it down and a melted line stays readable.' }
    ] };
  }
}
</script>
</body>
</html>
